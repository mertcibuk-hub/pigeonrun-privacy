<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pigeon Run</title>
<style>
  :root{--ink:#1A1F28;--dim:#5C6675;--line:#E2E6EC;--accent:#2F7FC1;--bg:#F7FAFC;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:48px 22px 90px}
  main{max-width:660px;margin:0 auto}
  h1{font-size:30px;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:14px;margin:0 0 38px}
  h2{font-size:18px;margin:36px 0 12px}
  p{margin:0 0 14px}
  a{color:var(--accent)}
  details{background:var(--card);border:1px solid var(--line);border-radius:9px;
          padding:14px 16px;margin-bottom:9px}
  summary{cursor:pointer;font-weight:600;font-size:15.5px}
  details p{margin:11px 0 2px;color:var(--dim);font-size:15px}
  .contact{background:var(--card);border:1px solid var(--line);border-radius:9px;
           padding:20px;margin-top:30px}
  footer{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);
         color:var(--dim);font-size:13.5px}
  @media (prefers-color-scheme:dark){
    :root{--ink:#E8EAEE;--dim:#98A2B0;--line:#2A2F38;--accent:#6FB4F0;--bg:#12151A;--card:#181C23}
  }
</style>
</head>
<body>
<main>
  <h1>Pigeon Run</h1>
  <p class="sub">Fly a pigeon through the city, grab snacks, grow your flock and dodge the hawk.</p>
  <details open><summary><a href="privacy.html">Privacy Policy</a></summary></details>
  <details open><summary><a href="support.html">Support &amp; FAQ</a></summary></details>
  <footer>Contact: <a href="mailto:mertcibuk@gmail.com">mertcibuk@gmail.com</a></footer>
</main>
</body>
</html>
